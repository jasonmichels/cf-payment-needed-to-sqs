name: Deploy to AWS Lambda

on:
  workflow_run:
    workflows: ["Go Test and Build"]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go version

      - name: Download modules
        run: go mod download

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -installsuffix cgo -o bootstrap .
          zip getpaymentneeded.zip bootstrap

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsSession

      - name: Update Lambda function code
        run: aws lambda update-function-code --function-name qa-cf-payments-needed-to-sqs --zip-file fileb://getpaymentneeded.zip
