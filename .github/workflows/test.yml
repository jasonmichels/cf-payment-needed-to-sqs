name: Go Test and Build

on:
  push:
    branches: [ "*" ]

jobs:
  test-and-build:
    name: Test and Build ClaimsFuel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'  # Specify your Go version here
      - run: go version

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -v ./... -bench . -cover > TestResults-1.25.json

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o bootstrap .
          zip getpaymentneeded.zip bootstrap

      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-1.25
          path: TestResults-1.25.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: getpaymentneeded.zip
          path: getpaymentneeded.zip